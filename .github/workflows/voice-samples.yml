name: Voice samples

# Generates sample Bible readings with designed voices (tools/voice/samples.py)
# and commits the MP3s to voice-samples/ on the same branch.
on:
  workflow_dispatch:
  push:
    paths:
      - tools/voice/samples.py
      - .github/workflows/voice-samples.yml

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg sox
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet qwen-tts soundfile scipy
      - name: Generate
        run: python tools/voice/samples.py
      - name: Commit samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice-samples
          git commit -m "Add generated voice samples" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
